name: Fix dist-tag to 0.4.72
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  fix-dist-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Set dist-tag latest to 0.4.72
        run: |
          npm dist-tag set dsh-model-switch@0.4.72 latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
