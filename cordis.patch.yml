# Replace independently packaged host modules only through public profile patches.
# Existing rows are disabled with their original name; replacements use unique ids.
# Do not replace agent-presets: a nested AgentPresets instance loads a second
# @deepseek-ai/dsh-scope identity, and session.create then fails as unscoped.
# Web selection is a deployment opt-in: preserve the existing complete Web config.
# An id-targeted config patch replaces (not merges) it, including fetchProvider.

- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  disabled: true

# The official Auto reviewer hardwires the session route; Model Switch replaces
# it with its own row so the reviewer model stays configurable (one registerAuto
# per context). A profile that never enabled the optional bundle has no such
# row: the non-insert target is then unknown and skipped with a warning.
- id: auto-review
  name: '@deepseek-ai/dsh-experimental-auto-review'
  disabled: true

# The official compaction engine hardwires the conversation target as its
# summarization route; Model Switch replaces it with its own row so the
# summarization model stays configurable (one compaction service per context).
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true

# The official naming provider derives the session-title route from the
# session's own logged route; Model Switch replaces it with its own row so the
# naming model stays configurable (one registered title provider per context).
# The row id is stable across both cadence packages, and the replacement row
# mounts whatever package the row declared, so a profile that restated this
# row as all-prompts keeps its cadence.
- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  disabled: true

# DSH 0.2.1's optional experimental session-titles bundle disables the row above
# and inserts its own all-prompts provider row. Model Switch owns this seam as
# well, so that row is disabled by its id too; a profile that never enabled the
# bundle has no such row and the non-insert target is skipped with a warning,
# exactly like the optional auto-review row above.
- id: optional-session-title-all-prompts
  name: '@deepseek-ai/dsh-session-title-all-prompts-llm'
  disabled: true

# The Web surface runs session compaction inside each agent preset's isolated
# compaction group, and the Loader patch index cannot address rows inside a
# preset's config.plugins list. This plugin therefore bridges the nested
# compaction engine at Host startup (src/preset-sync.ts): the shipped (or a
# deployment-edited) preset definition stays authoritative, and only the
# official compaction-basic row is disabled and followed by
# model-switch-compaction. Static copies of the shipped presets are gone —
# they broke DSH 0.2.1 turns, whose prompt-variable validation rejects the
# older copies' persona suffix (unknown prompt variable {{cwd}}), and local
# copies would hide every later preset change from the deployment.

- insert:
    # Register Model Switch Host Settings/Main runtime before routed Subagents.
    - id: model-switch
      name: 'dsh-model-switch'

    - id: model-switch-subagent-runtime
      name: 'dsh-model-switch/subagent-runtime'

    # The official auto-review gate under the reviewer-route llm scope.
    - id: model-switch-auto-review
      name: 'dsh-model-switch/auto-review'

    # The official compaction engine under the configurable summarization route.
    - id: model-switch-compaction
      name: 'dsh-model-switch/compaction'

    # The official naming provider under the configurable naming route.
    - id: model-switch-session-title
      name: 'dsh-model-switch/session-title'

    # Inject this plugin's Auto-review route and pure-read list into the
    # third-party @log.li/dsh-automode row's in-memory config (no profile write,
    # no-op when that plugin is not installed). Kept as its own row so it can be
    # disabled without touching the reviewer gate.
    - id: model-switch-automode-compat
      name: 'dsh-model-switch/automode-compat'

    # Fill the third-party dsh-prime-memory row's distillation route from this
    # plugin's provider-group route, in memory only (no profile write, no-op when
    # that plugin is not installed). Its own settings page keeps showing the
    # "follow the default model" state.
    - id: model-switch-prime-memory-compat
      name: 'dsh-model-switch/prime-memory-compat'
