# Replace independently packaged host modules only through public profile patches.
# Existing rows are disabled with their original name; replacements use unique ids.
# Do not replace agent-presets: a nested AgentPresets instance loads a second
# @deepseek-ai/dsh-scope identity, and session.create then fails as unscoped.
# Web selection is a deployment opt-in: preserve the existing complete Web config.
# An id-targeted config patch replaces (not merges) it, including fetchProvider.

- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  disabled: true

# The official Auto reviewer hardwires the session route; Model Switch replaces
# it with its own row so the reviewer model stays configurable (one registerAuto
# per context). A profile that never enabled the optional bundle has no such
# row: the non-insert target is then unknown and skipped with a warning.
- id: auto-review
  name: '@deepseek-ai/dsh-experimental-auto-review'
  disabled: true

- insert:
    # Register Model Switch Host Settings/Main runtime before routed Subagents.
    - id: model-switch
      name: 'dsh-model-switch'

    - id: model-switch-subagent-runtime
      name: 'dsh-model-switch/subagent-runtime'

    # The official auto-review gate under the reviewer-route llm scope.
    - id: model-switch-auto-review
      name: 'dsh-model-switch/auto-review'
